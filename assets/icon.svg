<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Dark rounded background with a subtle red glow halo. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FF3B3B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="#0A0A0A"/>
  <circle cx="64" cy="64" r="56" fill="url(#glow)"/>

  <!-- Crossed swords, scaled up from a 24x24 Lucide Swords path.
       Transform: translate(12,12) scale(5) gives 120px content area. -->
  <g
    transform="translate(12,12) scale(5)"
    fill="none"
    stroke="#FF3B3B"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
    <line x1="13" y1="19" x2="19" y2="13"/>
    <line x1="16" y1="16" x2="20" y2="20"/>
    <line x1="19" y1="21" x2="21" y2="19"/>
    <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
    <line x1="5" y1="14" x2="9" y2="18"/>
    <line x1="7" y1="17" x2="4" y2="20"/>
    <line x1="3" y1="19" x2="5" y2="21"/>
  </g>
</svg>
